[General]
bTraceEnabled=1
bSnapshotGrid=1
; H9: читать interior/exteriorBuffer (защищено __try/__except). При падении поставьте 0
bReadCellBuffers=1
; TESCellAttachDetachEvent очень шумный
bLogCellAttachPerRef=0
; Не пускать через загрузочные двери в бою (пример из стартового кода)
bBlockDoorsInCombat=0
; Ответы на горячие клавиши в левом верхнем углу: какой режим включён, что записано. Других сообщений нет (0.8.25)
bHotkeyMessages=1
; Пока открыт экран загрузки, ~1000 раз в секунду снимать, где выполняется главный поток (запись "profile" в трассе).
; Удлиняет экран загрузки на 15-22%. В 0.7.1 нашёл ~55 мс ожидания очереди IOManager после kPost; выключено
bProfileLoadingScreen=0
; Папка для CellLoadResearch.log и трассы. scripts/build.ps1 подставляет сюда <проект>\logs.
; Пусто - <Документы>\My Games\Skyrim Special Edition\SKSE
sLogDirectory=

[Hotkeys]
; DirectInput scan codes: 65 = F7, 87 = F11. F5/F9 заняты игрой (быстрое сохранение/загрузка)
iSnapshot=87
; Перебор наборов [Overrides]: значения игры -> набор 1 -> набор 2 -> ... -> значения игры
iCycleOverrides=65
; F6: сводка детекторов (ближайшие двери) на экране и в трассе. При [Detectors] bEnabled=0 - только то, что под взглядом
iDetectorsReport=64
; F8: эксперимент [InteriorSim]: выключено <-> портал
iInteriorSimStage=66
; F4: сглаживание TAA игры включено / выключено, только в памяти (SkyrimPrefs.ini не меняется). Проверка двоения картинки портала
iToggleTemporalAA=62
; F2: своя цветокоррекция картинки портала, по кругу 2 -> 0 -> 1 -> 2 (стадии [Portal] iGradeStages, 0.8.28).
; До 0.8.27 F2 окрашивал весь экран ImageSpace интерьера
iPortalGrading=60
; F3: записать, кто обращается к позиции игрока и камеры ([AccessWatch])
iAccessWatch=61

[Overrides]
; Наборы настроек игры, которые F7 подставляет в память (Skyrim.ini не меняется). Формат: имя:Секция=значение | ...
; Значения игры и что они делают (прогоны 0.7.0-0.7.1):
; fWarmStartMaxTime:HAVOK=4 - прогрев физики после перемещения (kPost->kFinish, 180-330 мс)
; fNormalDoorFadeSecs:General=0.4, fAutoDoorFadeSecs:General=0.5 - затемнение у двери (0.41 с)
; fMinSecondsForLoadFadeIn:Interface=1.5 + fFadeToBlackFadeSeconds:Interface=1 - проявление после загрузки (2.37 с)
; fTeleportDoorActivateDelayTimer=0.6 (настройка игры, без секции) - кандидат на паузу 0.65 с от двери до затемнения
sSet1=fWarmStartMaxTime:HAVOK=0 | fNormalDoorFadeSecs:General=0.05 | fAutoDoorFadeSecs:General=0.05 | fMinSecondsForLoadFadeIn:Interface=0 | fFadeToBlackFadeSeconds:Interface=0.05
sSet2=fWarmStartMaxTime:HAVOK=0 | fNormalDoorFadeSecs:General=0.05 | fAutoDoorFadeSecs:General=0.05 | fMinSecondsForLoadFadeIn:Interface=0 | fFadeToBlackFadeSeconds:Interface=0.05 | fTeleportDoorActivateDelayTimer=0

[Preload]
; Эксперимент: держать в памяти один интерьер, чтобы вход в него был мгновенным
bEnabled=1
; Интерьер (editor ID ячейки, как для coc)
sInteriorCell=WhiterunBanneredMare
; Как часто проверять удерживаемый интерьер
fRefreshSeconds=2.0
; Включить в памяти игры bPreloadLinkedInteriors (Skyrim.ini не меняется): предзагрузка интерьеров за ближними дверями
bPreloadLinkedInteriors=1
; Удерживать sInteriorCell: раз в fRefreshSeconds вызывать функцию игры QueueInteriorCellLoad (AE#18540).
; Выгруженный интерьер она ставит в очередь загрузки, загруженный - поднимает в начало буфера интерьеров,
; чтобы его не вытеснили другие предзагруженные интерьеры (в буфере всего 3 места)
bKeepInterior=1
; ... только пока дверь в него есть в загруженных ячейках, то есть игрок рядом
bKeepInteriorNearDoorOnly=1

[Detectors]
; Детекторы загрузочных дверей рядом с игроком (записи detector.doors).
; 0 - выключены (24.10.2026): сообщений и записей нет; двери ищутся молча, их ждут [Preload] и [InteriorSim]
bEnabled=0
fDoorsIntervalSeconds=0.5
iNearestCount=5

[InteriorSim]
; Эксперимент: интерьер sInteriorCell работает, пока игрок снаружи. F8 переключает:
; 0 - выключено; 1 - портал: мир Havok интерьера шагает вместе с миром игрока, NPC интерьера на уровне high,
; а сам интерьер рисуется второй камерой в текстуру на месте его двери ([Portal]).
; Стадии 1-5 версий 0.8.0-0.8.11 (интерьер в сцене улицы, над зданием, копия) убраны: docs/INTERIOR_SIM_STAGES.md
; Каждые fStatusSeconds в трассе (interior.sim status): шаги физики, NPC high, портал и сколько раз в секунду отсечение доходит до наблюдаемых узлов
iStartStage=0
; Как часто писать состояние эксперимента в трассу
fStatusSeconds=10
; Шаг мира Havok пропускается, если байт +0xC5F9 у bhkWorld равен 0. 1 = на время шага интерьера ставить его в 1
bForceWorldActive=1
; Интерьер портала подключается, как соседняя ячейка экстерьера (состояние kAttached): игра сама ведёт его NPC,
; анимации, огонь и физику, как у ячеек сетки вокруг игрока. 3D интерьера висит под собственным узлом вне сцены,
; поэтому его рисует только портал. Перед каждым экраном загрузки и сохранением отключается обратно.
; 0 - как в 0.8.15: интерьер остаётся отключённым (kUnattached), портал ведёт его сам
bAttachInterior=1
; T11 (0.8.27): NPC интерьера портала не опускаются из high на переходах (выход, вход, автосохранение).
; Иначе игра на ~1.7 с до подключения портала ведёт их по пути крупными скачками, а на входе переставляет
; в точку пакета; песня барда без high доходит до конца за кадры (T10). Работает только при F8 = портал.
; 0 - поведение игры (так делался контроль до 0.8.26)
bHoldPortalActors=1

[Portal]
; Стадия 1 [InteriorSim]: вместо двери висит прямоугольник (meshes\CellLoadResearch\portalquad.nif), на который
; каждый кадр перед отрисовкой мира рисуется интерьер камерой из глаза игрока, перенесённого через дверь.
; Пурпурный прямоугольник - текстура портала не подменилась. F11 при работающем портале пишет его картинку в portal-N.dds
bEnabled=1
; Размер текстуры портала, пиксели. 0 - как экран. Каждый кадр рисуется только видимая часть двери, в её размер на экране
iWidth=0
iHeight=0
; Ячейки движка, которые портал занимает на время своего прохода (номер цели рисования и буфера глубины)
iColorSlot=17
iDepthSlot=9
; Копии источников света интерьера, которые освещают только интерьер
bInteriorLights=1
; Динамические источники света рядом с игроком (факел, заклинание "Свет свечи"), перенесённые через дверь внутрь
bMirrorPlayerLights=1
; Фоновый и направленный свет интерьера (из его шаблона освещения) на время прохода портала
bInteriorAmbient=1
; Анимация NPC интерьера: игра обновляет её как анимацию невидимых NPC, которая не двигает ни одной кости (A-поза).
; Портал делает эти обновления полными, а тех NPC, кого игра пропустила, обновляет сам перед проходом
bAnimateActors=1
; 3D NPC переносится туда, где NPC находится по данным игры
bSyncActorPositions=1
; NPC интерьера получают полное обновление игры (ИИ, передвижение, анимация). Иначе игра даёт им урезанное:
; они дальше от камеры (на улице), чем их дистанция затухания
bFullActorProcessing=1
; NPC интерьера попадают в задания анимации самой игры (она берёт туда только NPC подключённых ячеек):
; анимация идёт в порядке игры, перед передвижением. Иначе их анимацию двигает портал перед своим проходом
bGameAnimatesActors=1
; Игра урезает выпуск всех частиц, когда их живых больше iMaxDesired:Particles (750). На улице Вайтрана выпуск падает примерно вдвое.
; 1: огонь и дым интерьера за порталом этому не подчиняются, горят как изнутри
bIgnoreParticleBudget=1
; Проход портала рисует и общие системы частиц игры (BSParticleSystemManager): в них огоньки свечей.
; Проход идёт сразу после заданий списков сцены: прямо перед RenderWorld это зависало (0.8.21),
; потому что задания игры в этот момент регистрируют те же проходы
bMasterParticles=1
; NPC интерьера считаются видимыми: игра снимает с них отметку kNotVisible. Без этого их высота не идёт за контроллером
bActorsSeen=1
; Для NPC интерьера камера мира (AE#36609) - камера портала: проверки расстояния и затухания идут через дверь
bVirtualCamera=1
; Звуки интерьера слышны на улице: их место переносится через дверь
bSoundThroughDoor=1
; GetDistance между игроком и ссылками интерьера идёт через дверь, а не "бесконечно далеко". При странном поведении NPC поставьте 0
bDistanceThroughDoor=1
; Субтитры говорящих в интерьере видны на улице: их место переносится через дверь (песня барда)
bSubtitlesThroughDoor=1
; Своя цветокоррекция картинки портала (T12), F2 переключает по кругу:
; 0 - как рисует проход (как в 0.8.26, но без окраски всего экрана);
; 1 - плюс композит интерьера, который игра делает после непрозрачных объектов: туман интерьера, множитель кадра
;     (invFrameBufferRange) и обрезка до 1; эффектам на время прохода - туман интерьера;
; 2 - плюс вид интерьера (его ImageSpace) под уличным: картинка заранее переводится так, чтобы уличная
;     цветокоррекция дала то же, что внутри. При ENB вторая стадия не работает (своя тональная компрессия)
iGradeStages=2
; Что стадия 2 снимает с квада до уличного ImageSpace: 0 - ничего; 1 - туман шейдера эффектов;
; 2 - туман шейдера эффектов и композит улицы (туман ещё раз и множитель кадра).
; Прогон 0.8.30: улица снимает с квада только туман эффекта, при 2 портал вдали вдвое ярче. Поэтому 1
iQuadFogModel=1
; Что F11 пишет кроме main-N.dds и portal-N.dds (снимки T12). 0 - не писать.
; Кадр после HDR (тональная компрессия, bloom, цвет): ldr-N.dds
bDumpLdr=1
; Цели адаптации глаза 1x1: запись portal.adapt в трассе. На этом шаге 0.8.28 повесил игру (исправлено в 0.8.29)
bDumpAdaptTargets=1
; При стадии 2 - картинка портала после своей цветокоррекции: graded-N.dds
bDumpGraded=1

[AccessWatch]
; Аппаратные точки останова на позициях игрока, его 3D и камер: кто и сколько раз к ним обратился.
; По F3 снимает fSeconds секунд и пишет таблицу в CellLoadResearch.access-N.txt. В это время игра может подтормаживать
bEnabled=1
fSeconds=3
; Захват закончится раньше после стольких срабатываний
iMaxHits=20000000

[Watchdog]
; Пока портал работает и 10 с после F11, поток-сторож следит за игрой снаружи. Нет ни одного тика игрока fHangSeconds секунд и главный
; поток не отвечает на сообщение окна - это зависание: стеки всех потоков пишутся в CellLoadResearch.hang.txt
bEnabled=1
fHangSeconds=6
; 1 - после записи стеков завершить игру, чтобы не пришлось перезагружать компьютер
bTerminate=1

[Probe]
; Тест симуляции (H11, H12): какие ячейки рисуются, считают физику и ИИ относительно игрока. Запись "probe" в трассе
bEnabled=1
fIntervalSeconds=5.0
; Сколько актёров записывать за раз: все high/middleHigh и те, что стоят в ячейках пробы
iMaxActors=400
; Запись actor.jump: шаг NPC длиннее бега за кадр, смена ячейки, возврат в списки high/middleHigh далеко от прежнего места.
; Со стеком вызова SetPosition, если он был
bActorJumps=1
; T11: уровни обработки NPC интерьера портала и удерживаемых ячеек. Записи actor.level (смена уровня, со стеком),
; actor.keptHigh (игра хотела опустить, удержание не дало), actor.snap (перестановка в точку пакета при подъёме в high),
; actor.warpQueued (скачок по точке пути у NPC не в high), actor.hold (ячейка удерживается или отпущена)
bTraceActorLevels=1
; T10: сцены. scene.start и scene.stop (со стеком) для всех сцен, scene.stop.papyrus (Scene.Stop из скрипта),
; scene.line (конец строки диалога в сцене) только для NPC интерьера портала и удерживаемых ячеек
bTraceScenes=1
