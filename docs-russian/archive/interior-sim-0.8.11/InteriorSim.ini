; F8: стадии эксперимента [InteriorSim] по кругу 0 -> 1 -> 2 -> 3 -> 4 -> 5 -> 6 -> 0
iInteriorSimStage=66
; F4: режимы глубины портала по кругу 0 -> 1 -> 2 -> 0 ([Portal] iDepthMode)
iPortalDepthMode=62

[Overrides]
; Наборы настроек игры, которые F7 подставляет в память (Skyrim.ini не меняется). Формат: имя:Секция=значение | ...
; Значения игры и что они делают (прогоны 0.7.0-0.7.1):
; fWarmStartMaxTime:HAVOK=4 - прогрев физики после перемещения (kPost->kFinish, 180-330 мс)
; fNormalDoorFadeSecs:General=0.4, fAutoDoorFadeSecs:General=0.5 - затемнение у двери (0.41 с)
; fMinSecondsForLoadFadeIn:Interface=1.5 + fFadeToBlackFadeSeconds:Interface=1 - проявление после загрузки (2.37 с)
; fTeleportDoorActivateDelayTimer=0.6 (настройка игры, без секции) - кандидат на паузу 0.65 с от двери до затемнения
sSet1=fWarmStartMaxTime:HAVOK=0 | fNormalDoorFadeSecs:General=0.05 | fAutoDoorFadeSecs:General=0.05 | fMinSecondsForLoadFadeIn:Interface=0 | fFadeToBlackFadeSeconds:Interface=0.05
sSet2=fWarmStartMaxTime:HAVOK=0 | fNormalDoorFadeSecs:General=0.05 | fAutoDoorFadeSecs:General=0.05 | fMinSecondsForLoadFadeIn:Interface=0 | fFadeToBlackFadeSeconds:Interface=0.05 | fTeleportDoorActivateDelayTimer=0

[AutoTest]
bEnabled=0
; Пусто - самое свежее сохранение
sSaveName=
fSettleSeconds=3.0
fStepTimeoutSeconds=60
bQuitWhenDone=0
; Пары для H4: дверь 1->3 (интерьер), 2->4 (экстерьер); coc 6->8->11 (интерьер), 7->9->12 (экстерьер); 10 = purge
sSteps=coc:RiverwoodSleepingGiantInn | door:nearest | door:nearest | door:nearest | walk:+x,4 | coc:WhiterunBanneredMare | coc:Riverwood | coc:WhiterunBanneredMare | coc:Riverwood | purge | coc:WhiterunBanneredMare | coc:Riverwood | coc:Whiterun

[Preload]
; Эксперимент: держать в памяти один интерьер и область экстерьера, чтобы вход в них был мгновенным
bEnabled=1
; Интерьер (editor ID ячейки, как для coc)
sInteriorCell=WhiterunBanneredMare
; Центр удерживаемой области экстерьера (editor ID ячейки, например Riverwood). Пусто = не удерживать экстерьер
sExteriorCell=
; Радиус в ячейках: 2 = 5x5 (как uGridsToLoad=5), 0 = одна ячейка
iExteriorRadius=2
; Как часто проверять и заново ставить в очередь выгруженные ячейки
fRefreshSeconds=2.0
; Включить в памяти игры bPreloadLinkedInteriors (Skyrim.ini не меняется): предзагрузка интерьеров за ближними дверями
bPreloadLinkedInteriors=1
; Удерживать sInteriorCell: раз в fRefreshSeconds вызывать функцию игры QueueInteriorCellLoad (AE#18540).
; Выгруженный интерьер она ставит в очередь загрузки, загруженный - поднимает в начало буфера интерьеров,
; чтобы его не вытеснили другие предзагруженные интерьеры (в буфере всего 3 места)
bKeepInterior=1
; ... только пока дверь в него есть в загруженных ячейках, то есть игрок рядом
bKeepInteriorNearDoorOnly=1

[Detectors]
; Детекторы загрузочных дверей и окон рядом с игроком (записи detector.doors / detector.windows).
; 0 - выключены (24.10.2026): окна не ищутся, сообщений и записей нет; двери ищутся молча, их ждут [Preload] и [InteriorSim]
bEnabled=0
; Сообщение на экране при смене ближайшей двери (не чаще раза в 2 с) и ближайшего окна (раз в 4 с)
bNotify=1
fDoorsIntervalSeconds=0.5
; Сколько ближайших дверей/окон отслеживать (запись в трассу при изменении этого списка)
iNearestCount=5
bWindows=1
fWindowsIntervalSeconds=2.0
; Радиус поиска окон в единицах игры (70 ~ 1 м)
fWindowRadius=3000
; Окно = геометрия, у которой путь диффузной текстуры (или модели) содержит одно из слов (через запятую).
; Окна Вайтрана: textures\architecture\whiterun\wrwindows01.dds; решётчатые окна домов - wrwoodlattice01.dds (F6 в 0.8.2)
sWindowKeywords=window,lattice
; ... и не содержит ни одного из этих (lod - окна на дальних моделях)
sWindowExclude=lod

[InteriorSim]
; Эксперимент: интерьер sInteriorCell работает, пока игрок снаружи. F8 переключает стадии:
; 0 - выключено; 1 - шаги физики интерьера вместе с миром игрока; 2 - плюс NPC интерьера на уровень high;
; 3 - плюс интерьер рисуется на месте своей двери (внутри здания); 4 - то же, поднятое на fLiftHeight над дверью;
; 5 - над дверью рисуется копия интерьера (клоны предметов без NPC), зарегистрированная в ShadowSceneNode для света;
; 6 - портал: интерьер рисуется второй камерой в текстуру, которая показывается на месте двери ([Portal]).
; Интерьер висит в узле наружной ячейки, где стоит дверь (0.8.4: игра рисует только то, что висит в узлах ячеек).
; На стадиях 3-5 на улице перед дверью стоят 2 контрольные копии двери (слева направо, если стоять спиной к двери):
; 1 - в узле наружной ячейки рядом с настоящей дверью, 2 - в нашем узле вместе с интерьером.
; Каждые fStatusSeconds на экране: сколько раз в секунду отрисовка доходит до каждого подвешенного узла
iStartStage=0
; Высота подъёма для стадии 4, единицы игры
fLiftHeight=1500
; Как часто выводить состояние эксперимента на экран
fStatusSeconds=10
; Шаг мира Havok пропускается, если байт +0xC5F9 у bhkWorld равен 0. 1 = на время шага интерьера ставить его в 1
bForceWorldActive=1
; Скрывать наружную дверь интерьера, пока он рисуется (стадии 3-5), чтобы заглянуть внутрь. Пройти через неё можно как обычно.
; Скрываются и дверь интерьера, ставшая в проём, и части зданий прямо за дверью: с текстурой двери (у "Гарцующей кобылы" -
; WRHouseBanneredMare01:16, wrdoor01.dds) и небольшие. Что было в проёме, пишется в трассу
bHideExteriorDoor=1

[Portal]
; Стадия 6 [InteriorSim]: вместо двери висит прямоугольник (meshes\CellLoadResearch\portalquad.nif), на который
; каждый кадр перед отрисовкой мира рисуется интерьер камерой из глаза игрока, перенесённого через дверь.
; Пурпурный прямоугольник - текстура портала не подменилась. F11 на стадии 6 пишет картинку портала в portal-N.dds
bEnabled=1
; Размер текстуры портала, пиксели. 0 - как экран. Каждый кадр рисуется только видимая часть двери, в её размер на экране
iWidth=0
iHeight=0
; Ячейки движка, которые портал занимает на время своего прохода (номер цели рисования и буфера глубины)
iColorSlot=17
iDepthSlot=9
; Копии источников света интерьера, которые освещают только интерьер
bInteriorLights=1
; Динамические источники света рядом с игроком (факел, заклинание "Свет свечи"), перенесённые через дверь внутрь
bMirrorPlayerLights=1
; Фоновый и направленный свет интерьера (из его шаблона освещения) на время прохода портала
bInteriorAmbient=1
; Как буфер глубины портала подставляется движку (огонь и другие эффекты проверяют глубину по основной ячейке kMAIN):
; 0 - своя ячейка и только вид глубины kMAIN для мягких частиц (0.8.9: огонь виден только издалека);
; 1 - вся ячейка kMAIN (0.8.10: огня нет совсем);
; 2 - вся ячейка kMAIN, мягкие частицы читают копию глубины, снятую перед первым эффектом
iDepthMode=2

[Probe]
; Тест симуляции (H11, H12): какие ячейки рисуются, считают физику и ИИ относительно игрока. Запись "probe" в трассе
bEnabled=1
fIntervalSeconds=5.0
; Сколько актёров записывать за раз: все high/middleHigh и те, что стоят в ячейках пробы
iMaxActors=400
